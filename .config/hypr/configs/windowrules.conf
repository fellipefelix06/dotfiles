# Sintaxe Hyprland 0.55+ (hyprlang): match:<prop> <regex>, <efeito> <valor>
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.8
windowrule = match:class ^(gedit|org.gnome.TextEditor|mousepad)$, opacity 0.9
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, opacity 0.9
windowrule = match:class ^(kitty)$, opacity 0.9
windowrule = match:class ^(discord|vesktop|org.telegram.desktop)$, opacity 0.85 override 0.7 override 1 override
windowrule = match:class ^(Spotify)$, opacity 0.8 override 0.6 override 1 override
windowrule = match:class ^(zen)$, opacity 0.9 override 0.7 override 1 override

windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float true
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, size 50% 60%

windowrule = match:title ^(Save As|Save a File|Pick Files)$, float true
windowrule = match:title ^(Save As|Save a File|Pick Files)$, size 50% 60%
windowrule = match:title ^(Save As|Save a File|Pick Files)$, center true

windowrule = match:title ^(Open Files)$, float true
windowrule = match:title ^(Open Files)$, size 70% 60%

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$ title:^$ xwayland:1 float:1 fullscreen:0 pin:0, no_focus true
